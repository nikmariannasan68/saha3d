<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>САХА 3D — Живая карта Якутии</title>
<meta name="description" content="Интерактивный 3D-атлас Республики Саха (Якутия): улусы и наслеги, реки и озёра, рельеф, спутниковые снимки, климат, транспорт, туризм. Открытые данные OpenStreetMap, NASA и Wikidata.">
<meta property="og:title" content="САХА 3D — Живая карта Якутии">
<meta property="og:description" content="Интерактивный 3D-атлас Республики Саха (Якутия) на открытых данных.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#060b16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23060b16' stroke='%23e8c26a' stroke-width='4'/%3E%3Cpath d='M12 42 26 22l8 11 6-7 12 16z' fill='%239fd8ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/cesium@1.123/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.123/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.123/Build/Cesium/Cesium.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<style>
:root{
  --bg:#060b16; --glass:rgba(12,20,36,.66); --glass2:rgba(18,28,48,.78);
  --line:rgba(160,210,255,.14); --line2:rgba(160,210,255,.26);
  --ice:#9fd8ff; --teal:#2dd4bf; --gold:#e8c26a; --text:#e8f1ff; --muted:#8ea3c2; --err:#f87171;
  --r:16px; --font:'Manrope',system-ui,sans-serif; --disp:'Unbounded','Manrope',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
#cesium{position:fixed;inset:0}
.cesium-viewer-bottom{left:auto!important;right:8px;bottom:34px!important}
.cesium-widget-credits{font-size:10px;opacity:.65}
button{font-family:inherit;color:inherit}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.btn{background:rgba(159,216,255,.08);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{background:rgba(159,216,255,.18);border-color:var(--ice)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:linear-gradient(135deg,#f3d27e,#c99a3c);color:#1a1405;border:0;font-weight:700}
.btn.on{background:rgba(45,212,191,.22);border-color:var(--teal)}
.muted{color:var(--muted)}
.hidden{display:none!important}
.fade{transition:opacity .8s, transform .8s}
input,select{font-family:inherit;color:var(--text);background:rgba(6,12,24,.7);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--ice)}
select option{background:#0c1424}
/* intro */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:20;text-align:center}
#intro .title{font-family:var(--disp);font-size:clamp(46px,9vw,118px);font-weight:700;letter-spacing:.06em;background:linear-gradient(180deg,#fff 10%,#9fd8ff 60%,#2dd4bf);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 60px rgba(120,200,255,.25);line-height:1}
#intro .sub{font-size:clamp(16px,2.2vw,24px);margin:14px 0 34px;color:#cfe5ff;letter-spacing:.12em;text-transform:uppercase}
#intro .btn.gold{pointer-events:auto;font-size:17px;padding:15px 34px;border-radius:40px;box-shadow:0 0 40px rgba(232,194,106,.35)}
#introStatus{margin-top:22px;font-size:13px;color:var(--muted);min-height:18px;pointer-events:auto}
#skip{position:fixed;right:24px;bottom:56px;z-index:25}
#regionTitle{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:21;font-family:var(--disp);font-size:clamp(22px,4vw,48px);text-align:center;opacity:0;pointer-events:none;text-shadow:0 0 30px rgba(232,194,106,.6)}
#regionTitle small{display:block;font-family:var(--font);font-size:14px;letter-spacing:.3em;color:var(--gold);margin-top:8px}
/* top bar */
#top{position:fixed;left:12px;right:12px;top:12px;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:10}
#logo{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.08em;white-space:nowrap;cursor:pointer}
#logo span{color:var(--gold)}
#searchWrap{position:relative;flex:1;max-width:520px}
#search{width:100%;padding:10px 14px 10px 36px;border-radius:12px}
#searchWrap svg{position:absolute;left:11px;top:11px;opacity:.6}
#sugg{position:absolute;left:0;right:0;top:46px;max-height:360px;overflow:auto;padding:6px;z-index:30}
.sg{padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sg:hover,.sg.act{background:rgba(159,216,255,.12)}
.sg .k{font-size:11px;color:var(--muted);white-space:nowrap}
#top .sp{flex:1}
/* crumbs */
#crumbs{position:fixed;left:84px;top:78px;z-index:9;padding:7px 14px;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#crumbs a{color:var(--ice);cursor:pointer;text-decoration:none}
#crumbs a:hover{text-decoration:underline}
/* left nav */
#nav{position:fixed;left:12px;top:78px;width:60px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:10}
.nb{width:46px;height:46px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.nb:hover{background:rgba(159,216,255,.1)}
.nb.on{background:rgba(45,212,191,.18);border-color:rgba(45,212,191,.5)}
.nb svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:54px;white-space:nowrap;background:var(--glass2);padding:5px 9px;border-radius:8px;font-size:12px;border:1px solid var(--line)}
#left{position:fixed;left:84px;top:118px;bottom:56px;width:330px;z-index:9;display:flex;flex-direction:column;overflow:hidden}
#left h3,#right h3{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lh{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.lb{padding:4px 16px 16px;overflow:auto;flex:1}
.x{background:none;border:0;cursor:pointer;font-size:20px;color:var(--muted);line-height:1}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.row label{flex:1;cursor:pointer}
.sec{margin:14px 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.item{padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px;border:1px solid transparent}
.item:hover{background:rgba(159,216,255,.08);border-color:var(--line)}
.item small{color:var(--muted);white-space:nowrap}
.note{font-size:12px;color:var(--muted);line-height:1.5;padding:8px 10px;border-left:2px solid var(--gold);background:rgba(232,194,106,.06);border-radius:0 8px 8px 0;margin:8px 0}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);margin:2px 4px 2px 0}
.switch{appearance:none;width:34px;height:19px;border-radius:20px;background:#22314d;position:relative;cursor:pointer;border:0;padding:0;flex:none}
.switch:checked{background:var(--teal)}
.switch::after{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
.switch:checked::after{left:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* right panel */
#right{position:fixed;right:12px;top:78px;bottom:56px;width:390px;z-index:9;display:flex;flex-direction:column;overflow:hidden;transform:translateX(0);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
#right.off{transform:translateX(420px);opacity:0;pointer-events:none}
#rb{overflow:auto;flex:1;padding:0 18px 18px}
.kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.pt{font-family:var(--disp);font-size:24px;font-weight:600;margin:6px 0 2px;line-height:1.2}
.alt{color:var(--ice);font-size:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.fact{background:rgba(159,216,255,.05);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.fact b{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:3px}
.fact span{font-size:14px;font-weight:600}
.fact i{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:2px}
.fact.w{grid-column:1/-1}
.tabs{display:flex;gap:4px;margin:10px 0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:9px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:none}
.tab.on{background:rgba(45,212,191,.18);border-color:var(--teal)}
.photo{width:100%;border-radius:12px;margin:8px 0;max-height:220px;object-fit:cover;border:1px solid var(--line)}
.emb{display:flex;gap:12px;align-items:flex-end;margin:8px 0}
.emb img{height:80px;max-width:120px;object-fit:contain;background:rgba(255,255,255,.04);border-radius:8px;padding:4px}
.emb figure{margin:0;text-align:center;font-size:11px;color:var(--muted)}
.txt{font-size:14px;line-height:1.6;color:#d4e3fa}
.src{font-size:11px;color:var(--muted);line-height:1.6;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.src a{color:var(--ice)}
.tbd{color:var(--muted);font-style:italic}
/* bottom bar */
#bottom{position:fixed;left:12px;right:12px;bottom:10px;height:38px;display:flex;align-items:center;gap:18px;padding:0 14px;font-size:12px;z-index:10;font-variant-numeric:tabular-nums}
#bottom .v{color:var(--ice)}
#compass{width:28px;height:28px;cursor:pointer;flex:none}
#scalebar{display:flex;align-items:center;gap:6px}
#scalebar i{display:block;height:6px;border:1.5px solid var(--ice);border-top:0;width:100px}
/* tooltip */
#tip{position:fixed;z-index:40;pointer-events:none;padding:8px 12px;font-size:13px;max-width:260px;transform:translate(14px,14px)}
#tip b{display:block;font-size:14px}
/* tool hint / flight */
#hint{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);z-index:12;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;max-width:92vw;flex-wrap:wrap}
#flight{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);z-index:12;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:94vw}
#flight .ft{font-weight:700;margin-right:6px}
#flight label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#flight input[type=range]{width:100px;padding:0}
#profile{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:12;width:min(760px,92vw);padding:12px 14px}
#profile svg{width:100%;height:170px}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:50;padding:10px 16px;font-size:14px;display:flex;gap:10px;align-items:center;max-width:90vw}
#toast.err{border-color:rgba(248,113,113,.6)}
#modal{position:fixed;inset:0;z-index:60;background:rgba(2,6,14,.55);display:flex;align-items:center;justify-content:center}
#modal .glass{width:min(520px,92vw);padding:20px;max-height:86vh;overflow:auto}
#split{position:fixed;top:0;bottom:0;left:50%;width:0;z-index:7;pointer-events:none}
#split .ln{position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--gold);box-shadow:0 0 12px rgba(232,194,106,.8)}
#split .hd{position:absolute;top:50%;left:-19px;width:38px;height:38px;margin-top:-19px;border-radius:50%;background:var(--glass2);border:2px solid var(--gold);cursor:ew-resize;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gold)}
#split .lb{position:absolute;top:130px;white-space:nowrap;font-size:12px;padding:4px 10px;pointer-events:none}
#split .lb.l{right:14px} #split .lb.r{left:14px}
#stBadge{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:8;padding:6px 14px;font-size:12px;white-space:nowrap}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.seg .btn{padding:6px 9px;font-size:12px}
#legend{position:fixed;right:12px;bottom:56px;z-index:8;padding:10px 12px;font-size:11px;width:200px}
#legend .bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#0e6b52,#3d9a58,#b9c76b,#d8b05a,#a86b3c,#8a7d78,#fff);margin:6px 0 3px}
.ui{opacity:0;pointer-events:none;transition:opacity .9s}
body.map .ui{opacity:1;pointer-events:auto}
body.map #right.off{pointer-events:none}
@media (max-width:820px){
  #logo{font-size:14px} #top .hideM{display:none}
  #left{left:8px;right:8px;width:auto;top:auto;bottom:54px;height:55vh}
  #right{left:8px;right:8px;width:auto;top:auto;bottom:54px;height:62vh}
  #right.off{transform:translateY(70vh)}
  #nav{top:auto;bottom:54px;left:8px;right:8px;width:auto;flex-direction:row;justify-content:space-around;height:56px;padding:0 6px}
  body.panel #nav{display:none}
  #crumbs{left:8px;top:74px}
  #bottom{gap:10px;font-size:11px} #bottom .hideM{display:none}
  .nb[data-tip]:hover::after{display:none}
}
</style>
</head>
<body>
<div id="cesium"></div>
<canvas id="snowfx" style="position:fixed;inset:0;pointer-events:none;z-index:5;display:none"></canvas>

<!-- ===== INTRO ===== -->
<div id="intro" class="fade">
  <div class="title">САХА 3D</div>
  <div class="sub">Открой для себя Якутию</div>
  <button class="btn gold" id="start">Начать путешествие</button>
  <div id="introStatus">Загружаем реальные границы из OpenStreetMap…</div>
</div>
<button class="btn hidden" id="skip">Пропустить анимацию ⏭</button>
<div id="regionTitle">Республика Саха (Якутия)<small>САХА ӨРӨСПҮҮБҮЛҮКЭТЭ</small></div>

<!-- ===== TOP ===== -->
<div id="top" class="glass ui">
  <div id="logo" title="Вся Якутия">САХА <span>3D</span></div>
  <div id="searchWrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" placeholder="Улус, наслег, село, река, озеро или «62.03, 129.73»" autocomplete="off">
    <div id="sugg" class="glass hidden"></div>
  </div>
  <div class="sp"></div>
  <select id="baseSel" title="Картографическая подложка"></select>
  <button class="btn" id="dim" title="Переключение 2D/3D">2D</button>
  <select id="langSel" class="hideM" title="Язык подписей объектов">
    <option value="ru">RU</option><option value="sah">САХА</option><option value="en">EN</option>
  </select>
  <button class="btn" id="settingsBtn" title="Настройки">⚙</button>
</div>
<div id="crumbs" class="glass ui"></div>

<!-- ===== LEFT NAV ===== -->
<div id="nav" class="glass ui">
  <button class="nb" data-p="layers" data-tip="Слои и карты"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="nb" data-p="districts" data-tip="Улусы и округа"><svg viewBox="0 0 24 24"><path d="M4 5l5-2 6 2 5-2v16l-5 2-6-2-5 2z"/><path d="M9 3v16M15 5v16"/></svg></button>
  <button class="nb" data-p="flight" data-tip="Путешествие по Якутии"><svg viewBox="0 0 24 24"><path d="M2 16l20-8-8 12-2-6-10 2z"/></svg></button>
  <button class="nb" data-p="tools" data-tip="Измерения"><svg viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg></button>
  <button class="nb" data-p="time" data-tip="Время и космос: снимки, климат, снег"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/><path d="M2 12h2M20 12h2"/></svg></button>
  <button class="nb" data-p="saved" data-tip="Избранное и история"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.3.9-4.5 4.4 1 6.1-5.5-2.9L6.5 20l1-6.1L3 9.5l6.3-.9z"/></svg></button>
  <button class="nb" data-p="edu" data-tip="Школьный атлас"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg></button>
</div>
<div id="left" class="glass ui hidden">
  <div class="lh"><h3 id="lt"></h3><button class="x" id="lx">×</button></div>
  <div class="lb" id="lb"></div>
</div>

<!-- ===== RIGHT PANEL ===== -->
<div id="right" class="glass ui off">
  <div class="lh"><button class="btn" id="back">← Вся Якутия</button><button class="x" id="rx">×</button></div>
  <div id="rb"></div>
</div>

<!-- ===== BOTTOM ===== -->
<div id="bottom" class="glass ui">
  <svg id="compass" viewBox="0 0 40 40" title="Север"><circle cx="20" cy="20" r="18" fill="rgba(6,12,24,.6)" stroke="rgba(159,216,255,.4)"/><g id="needle"><path d="M20 5 25 20H15z" fill="#e8c26a"/><path d="M20 35 25 20H15z" fill="#8ea3c2"/></g><text x="20" y="13" font-size="0" fill="#fff">N</text></svg>
  <div>Курсор: <span class="v" id="cur">—</span></div>
  <div class="hideM">Высота рельефа: <span class="v" id="elev">—</span></div>
  <div class="hideM" id="gvalW" style="display:none"><span id="gvalN"></span>: <span class="v" id="gval">—</span></div>
  <div>Камера: <span class="v" id="camh">—</span></div>
  <div id="scalebar" class="hideM"><i></i><span class="v" id="scale">—</span></div>
  <div class="sp" style="flex:1"></div>
  <div class="hideM muted" id="dataDate"></div>
</div>

<div id="tip" class="glass hidden"></div>
<div id="hint" class="glass hidden"></div>
<div id="flight" class="glass hidden">
  <span class="ft" id="ftTitle"></span>
  <button class="btn" id="fPlay">⏸ Пауза</button>
  <label>Скорость <input type="range" id="fSpeed" min="0.25" max="4" step="0.25" value="1"><span id="fSpeedV">1×</span></label>
  <label id="fAltWrap">Высота <input type="range" id="fAlt" min="300" max="40000" step="100" value="4000"><span id="fAltV">4000 м</span></label>
  <button class="btn" id="fStop">■ Стоп</button>
  <button class="btn" id="fHome">Вернуться на карту</button>
</div>
<div id="profile" class="glass hidden"></div>
<div id="legend" class="glass hidden"><b>Абсолютная высота (DEM)</b><div class="bar"></div><div style="display:flex;justify-content:space-between"><span>0</span><span>1000</span><span>2000</span><span>3000 м</span></div></div>
<div id="split" class="hidden"><div class="ln"></div><div class="hd" title="Потяните, чтобы сравнить">⇔</div><div class="lb l glass" id="splitL"></div><div class="lb r glass" id="splitR"></div></div>
<div id="stBadge" class="glass ui hidden"></div>
<div id="toast" class="glass hidden"></div>
<div id="modal" class="hidden"></div>

<script>
'use strict';
/* =====================================================================
   САХА 3D — single-file build (v0.1)
   Модули (в одном файле, разделы помечены):
   0. Utils & Store          5. RiversLayer / LakesLayer
   1. EarthGlobe (Viewer)    6. Selection & InfoPanels
   2. Basemaps/Terrain       7. SearchPanel
   3. DataService (OSM...)   8. CameraController / VirtualFlight
   4. DistrictLayer/Nasleg   9. MeasurementTools  10. UI wiring
   ===================================================================== */
const C = Cesium;

/* ---------- 0. Utils & Store ---------- */

async function fetchTimeout(url, ms, outer) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  if (outer) outer.addEventListener('abort', () => ac.abort());

  catch (e) { throw e.name === 'AbortError' ? new Error('нет ответа за ' + Math.round(ms / 1000) + ' с') : e; }

   через ~3 с (у перегруженных серверов слоты освобождаются быстро), пока не истечёт общий срок.
   Берётся первый успешный ответ, остальные запросы отменяются. */
async function mirrorLoop(u, q, deadline, stop) {
  let last = new Error('нет ответа');
  while (!stop.signal.aborted && Date.now() < deadline - 1500) {
    try {
      const r = await fetchTimeout(u + '?data=' + encodeURIComponent(q), deadline - Date.now(), stop.signal);
      if (!r || !Array.isArray(r.elements)) throw new Error('пустой ответ');
      if (r.remark && /runtime error|timed out|out of memory/i.test(r.remark)) throw new Error(r.remark.slice(0, 80));
      return r;
    } catch (e) { last = e; if (stop.signal.aborted) break; await sleep(2500 + Math.random() * 1500); }
  }

}

    const j = await Promise.any(OVERPASS.map(u => mirrorLoop(u, q, deadline, stop)));
    stop.abort();
    return j;
  } catch (e) {
    stop.abort();
    const last = e.errors ? [...new Set(e.errors.map(x => x.message))].join('; ') : e.message;
    console.warn('Overpass', last);
    throw new Error('серверы OpenStreetMap (Overpass) перегружены или недоступны (' + last + '). Попробуйте через минуту');
  }
}

const gvTiles = new Map();
async function gibsValueAt(k, date, lon, lat) {

      i.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 256; const ctx = c.getContext('2d', {willReadFrequently: true}); ctx.drawImage(i, 0, 0); res(ctx.getImageData(0, 0, 256, 256).data); };

async function loadOvation() {

    lat.push(bl); val.push(best);
  }

/* enrichment from Wikidata + Wikipedia (real sourced data only) */
async function enrich(qid, wpTag, kind, ref) {
  const box = () => S.sel === ref ? $('#wdBox') : null, wbox = () => S.sel === ref ? $('#wikiBox') : null;
  let title = null, lang = 'ru';
  if (wpTag) { const m = /^(\w+):(.+)$/.exec(wpTag); if (m) { lang = m[1]; title = m[2]; } }
  try {
    if (qid) {
      const ents = await wd([qid]); const e = ents[qid];
      if (e && !('missing' in e)) {
        const refs = new Set();
        ['P885', 'P403', 'P4614', 'P974', 'P36', 'P131'].forEach(p => claimAll(e, p).forEach(v => v.id && refs.add(v.id)));
        let lab = {};
        if (refs.size) { const le = await wd([...refs].slice(0, 50), 'labels'); for (const k in le) lab[k] = (le[k].labels && (le[k].labels.ru || le[k].labels.en) || {}).value || k; }
        const L = v => esc(lab[v.id] || v.id);
        const f = [];
        const pop = claimBest(e, 'P1082'), ar = claimBest(e, 'P2046'), inc = claimBest(e, 'P571');
        if (kind === 'admin') {
          if (pop) f.push(fact('Население (Wikidata)', qty(pop.v) + ' чел.', pop.date ? 'на ' + pop.date + ' г.' : 'год не указан'));
          if (ar) f.push(fact('Площадь (Wikidata)', qty(ar.v)));
          if (inc && $('#wdIncept')) $('#wdIncept').textContent = inc.v.time.slice(1, 5);
        }
        if (kind === 'river') {
          const len = claimBest(e, 'P2043'); if (len && $('#wdLen')) $('#wdLen').textContent = qty(len.v);
          const src = claimAll(e, 'P885'), mouth = claimAll(e, 'P403'), bas = claimBest(e, 'P2053'), db = claimAll(e, 'P4614'), trib = claimAll(e, 'P974');
          f.push(fact('Исток', src.length ? src.map(L).join(', ') : TBD), fact('Устье', mouth.length ? mouth.map(L).join(', ') : TBD));
          f.push(fact('Площадь бассейна', bas ? qty(bas.v) : TBD), fact('Бассейн', db.length ? db.map(L).join(', ') : TBD));
          f.push(fact('Притоки', trib.length ? trib.slice(0, 25).map(L).join(', ') + (trib.length > 25 ? '…' : '') : TBD, 'Wikidata', true));
        }
        if (kind === 'lake') {
          const dep = claimBest(e, 'P4511'), el = claimBest(e, 'P2044');
          if (ar) f.push(fact('Площадь (Wikidata)', qty(ar.v)));
          f.push(fact('Глубина', dep ? qty(dep.v) : TBD, dep ? 'Wikidata' : ''));
          if (el) f.push(fact('Высота над уровнем моря', qty(el.v)));
        }
        const coa = claimBest(e, 'P94'), flag = claimBest(e, 'P41'), img = claimBest(e, 'P18');
        let emb = '';
        if (coa) emb += `<figure><img src="${commons(coa.v)}" alt="" loading="lazy"><div>Герб</div></figure>`;
        if (flag) emb += `<figure><img src="${commons(flag.v)}" alt="" loading="lazy"><div>Флаг</div></figure>`;
        const sah = e.labels && e.labels.sah && e.labels.sah.value;
        const b = box();
        if (b) b.innerHTML = (sah && S.lang !== 'sah' ? `<div class="alt" style="margin:-6px 0 8px">${esc(sah)} <span class="muted">· саха тыла (Wikidata)</span></div>` : '') +
          (f.length ? `<div class="facts" style="margin-top:0">${f.join('')}</div>` : '') + (emb ? `<div class="emb">${emb}</div>` : '') +
          (img && !emb ? '' : '');
        if (e.sitelinks) {
          if (e.sitelinks.ruwiki) { title = e.sitelinks.ruwiki.title; lang = 'ru'; }
          else if (!title && e.sitelinks.enwiki) { title = e.sitelinks.enwiki.title; lang = 'en'; }
          if (e.sitelinks.sahwiki && b) b.innerHTML += `<div class="muted" style="font-size:12px">Статья на саха тыла: <a style="color:var(--ice)" target="_blank" href="https://sah.wikipedia.org/wiki/${encodeURIComponent(e.sitelinks.sahwiki.title)}">${esc(e.sitelinks.sahwiki.title)}</a></div>`;
        }

      `<div>${esc(s.extract || '')}</div><div class="muted" style="font-size:12px;margin-top:6px">Википедия: <a style="color:var(--ice)" target="_blank" href="${esc(s.content_urls && s.content_urls.desktop.page)}">${esc(s.title)}</a> (CC BY-SA)</div>`;

const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е');
function buildIndex() {
  const ix = [];
  S.districts.forEach(d => ix.push({n: nm(d.tags), a: [d.tags.name, d.tags['name:sah'], d.tags['name:en']], k: 'Улус / округ', ref: {kind: 'district', id: d.id}, w: 5}));
  S.naslegById.forEach(n => ix.push({n: nm(n.tags), a: [n.tags.name, n.tags['name:sah']], k: 'Наслег · ' + nm(S.byId.get(n.parent).tags), ref: {kind: 'nasleg', id: n.id, parent: n.parent}, w: 3}));
  const pw = {city: 4.5, town: 4, village: 2, hamlet: 1};
  S.places.forEach(p => ix.push({n: nm(p.tags), a: [p.tags.name, p.tags['name:sah'], p.tags['name:en']], k: (PLACE_TYPE[p.tags.place] || '') + (p.d ? ' · ' + nm(S.byId.get(p.d).tags) : ''), ref: {kind: 'place', id: p.id}, w: pw[p.tags.place] || 1}));
  (S.rivers || []).forEach(r => ix.push({n: r.name, a: [r.name_en], k: 'Река', ref: {kind: 'river', id: r.id}, w: 4.2}));
  (S.lakes || []).forEach(l => ix.push({n: l.name, a: [], k: 'Озеро · ' + fmt(l.area) + ' км²', ref: {kind: 'lake', id: l.id}, w: 3.5}));
  for (const k in S.th) S.th[k].forEach(o => { const n = nm(o.tags); if (n) ix.push({n, a: [o.tags.name, o.tags['name:sah'], o.tags.official_name, o.tags.iata, o.tags.icao], k: THEMES[k].n, ref: {kind: 'theme', key: k, id: o.id}, w: k === 'peaks' || k === 'airports' || k === 'oopt' ? 3.8 : 2.5}); });
  ix.forEach(o => { o.s = [o.n, ...o.a].filter(Boolean).map(norm); });
  S.index = ix;
}
function doSearch(q) {
  q = norm(q.trim()); if (!q) return [];
  const m = /^\s*(-?\d{1,2}(?:[.,]\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:[.,]\d+)?)\s*$/.exec(q);
  const res = [];
  if (m) { const lat = parseFloat(m[1].replace(',', '.')), lon = parseFloat(m[2].replace(',', '.')); if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) res.push({n: `${lat}, ${lon}`, k: 'Координаты WGS84', coord: [lon, lat]}); }
  for (const o of S.index) {
    let sc = 0;
    for (const s of o.s) { if (s === q) sc = Math.max(sc, 3); else if (s.startsWith(q)) sc = Math.max(sc, 2); else if (s.includes(q)) sc = Math.max(sc, 1); }
    if (sc) res.push({...o, sc: sc * 10 + o.w});
  }
  return res.sort((a, b) => (b.sc || 99) - (a.sc || 99)).slice(0, 14);
}

const F = {active: false, paused: false, speed: 1, alt: 4000, mode: null};
function startPathFlight(coords, title) {

  beginFlight(title, true);
}
function startOrbit(bbox, title) {

  beginFlight(title, false);
}
function flyRidge(o, name) {

  startPathFlight(o.line, 'Хребет ' + name);
}
function orbitPeak(o, name) {
  stopFlight(true);
  const ele = +(o.tags.ele || 0) || 0, h = S.terrain ? Math.max(ele * (scene.verticalExaggeration || 1), gh(o.pt[0], o.pt[1])) : 0;
  F.bs = new C.BoundingSphere(C.Cartesian3.fromDegrees(o.pt[0], o.pt[1], h), 5500); F.h = 0; F.mode = 'orbit';

}
function beginFlight(title, alt) {
  F.active = true; F.paused = false; closeLeft(); closePanel();   // карточки не закрывают обзор в полёте
  scene.screenSpaceCameraController.enableInputs = false;
  $('#ftTitle').textContent = title; $('#fPlay').textContent = '⏸ Пауза';
  $('#fAltWrap').style.display = alt ? '' : 'none';
  $('#flight').classList.remove('hidden');
}
function stopFlight(keep) {
  if (!F.active) return;
  F.active = false; camera.lookAtTransform(C.Matrix4.IDENTITY);
  scene.screenSpaceCameraController.enableInputs = true;

}
function along(s) {
  const cum = F.cum; s = Math.min(Math.max(s, 0), F.total);
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const t = (s - cum[lo]) / ((cum[hi] - cum[lo]) || 1), a = F.path[lo], b = F.path[hi];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
const gh = (lon, lat) => (S.terrain && globe.getHeight(C.Cartographic.fromDegrees(lon, lat))) || 0;
function flightTick(dt) {
  if (!F.active || F.paused) return;
  if (F.mode === 'orbit') {
    F.h += dt * .12 * F.speed;
    camera.lookAt(F.bs.center, new C.HeadingPitchRange(F.h, C.Math.toRadians(-38), F.bs.radius * 2.2));
    return;
  }
  const v = Math.max(F.total / 80, 300) * F.speed;   // весь маршрут ≈ 80 с при 1×
  F.s += v * dt;
  if (F.s >= F.total) { F.s = F.total; F.paused = true; $('#fPlay').textContent = '▶ Сначала'; }
  const look = Math.max(F.alt * 4, 8000);
  const p = along(F.s), q = along(F.s + look), q2 = along(F.s + look * 2);
  let br = C.Math.toRadians(turf.bearing(p, q.map((x, i) => x === p[i] ? x + 1e-6 : x)));
  if (F.hd == null) F.hd = br;
  let dh = C.Math.negativePiToPi(br - F.hd); F.hd += dh * Math.min(1, dt * 1.6);
  // учитываем рельеф: камера не ниже максимума рельефа под собой и впереди
  const ground = Math.max(gh(p[0], p[1]), gh(q[0], q[1]), gh(q2[0], q2[1]));
  const h = ground + F.alt;

}
function greedyTour(points) {
  const left = [...points], out = [left.shift()];

}

  scene.canvas.style.cursor = 'pointer';
  let html = '';
  if (s.kind === 'district') { const d = S.byId.get(s.id); html = `<b>${esc(nm(d.tags))}</b>Центр: ${d.centre ? esc(nm(d.centre.tags)) : '—'}<br><span class="muted">${fmt(d.area)} км²${d.tags.population ? ' · ' + fmt(d.tags.population) + ' чел.' : ''}</span>`; }
  if (s.kind === 'nasleg') { const n = S.naslegById.get(s.id); html = `<b>${esc(nm(n.tags))}</b><span class="muted">наслег · ${fmt(n.area)} км²</span>`; }
  if (s.kind === 'place') { const p = S.placeById.get(s.id); html = `<b>${esc(nm(p.tags))}</b><span class="muted">${PLACE_TYPE[p.tags.place] || ''}${p.tags.population ? ' · ' + fmt(p.tags.population) + ' чел.' : ''}</span>`; }
  if (s.kind === 'river') html = `<b>${esc(S.riverById.get(s.id).name)}</b><span class="muted">река · нажмите для карточки</span>`;
  if (s.kind === 'theme') { const o = S.thById[s.key].get(s.id); html = `<b>${esc(nm(o.tags) || themeKind(o) || 'Без названия')}</b><span class="muted">${esc(THEMES[s.key].n)}${o.tags.ele && s.key === 'peaks' ? ' · ' + esc(o.tags.ele) + ' м' : ''}</span>`; }
  if (s.kind === 'lake') { const l = S.lakeById.get(s.id); html = `<b>${esc(l.name)}</b><span class="muted">озеро · ${fmt(l.area, 1)} км²</span>`; }
  tip.innerHTML = html; tip.style.left = pos.x + 'px'; tip.style.top = pos.y + 'px'; tip.classList.remove('hidden');
  const key = s.kind + s.id;
  if (S.hover !== key) {
    S.hover = key;
    if (s.kind === 'district') hoverOutline(S.byId.get(s.id));
    else if (s.kind === 'theme') { dsH.entities.removeAll(); const o = S.thById[s.key].get(s.id); if (o.geometry) addRings(dsH, o.geometry, GOLD.withAlpha(.9), 2.2); }
    else if (s.kind === 'nasleg') { dsH.entities.removeAll(); addRings(dsH, S.naslegById.get(s.id).geometry, GOLD.withAlpha(.9), 2.2); }
    else dsH.entities.removeAll();
  }
}
function pickSaha(pos) {
  const arr = scene.drillPick(pos, 4);
  const hit = arr.find(p => p.id && p.id.saha && p.id.saha.kind !== 'district') || arr.find(p => p.id && p.id.saha);
  return hit ? hit.id.saha : null;
}

/* ---------- Intro journey ---------- */
function fly(o) { return new Promise(res => { if (S.skip) return res(); camera.flyTo({...o, complete: res, cancel: res}); }); }
let dataReady;
async function journey() {
  S.phase = 'flying'; $('#intro').style.opacity = 0; $('#intro').style.transform = 'scale(1.08)';
  setTimeout(() => $('#intro').classList.add('hidden'), 900);
  $('#skip').classList.remove('hidden');
  const E = C.EasingFunction.QUADRATIC_IN_OUT;
  await fly({destination: C.Cartesian3.fromDegrees(95, 45, 1.55e7), duration: 3.2, easingFunction: E});
  await fly({destination: C.Cartesian3.fromDegrees(127, 49, 6.8e6), orientation: {heading: 0, pitch: C.Math.toRadians(-78), roll: 0}, duration: 3.2, easingFunction: E});
  if (!S.skip) {
    await dataReady;
    dsRep.show = true;
    const rt = $('#regionTitle'); rt.style.transition = 'opacity 1s'; rt.style.opacity = 1;
    await sleep(2300); rt.style.opacity = 0;
  }
  await fly({...HOME, duration: 2.8, easingFunction: E});
  enterMap();
}
function enterMap() {
  if (S.phase === 'map') return;
  S.phase = 'map'; $('#skip').classList.add('hidden'); $('#regionTitle').style.opacity = 0;
  if (S.skip) { camera.cancelFlight(); camera.setView(HOME); }
  $('#intro').classList.add('hidden');
  document.body.classList.add('map');
  Object.entries(S.layers).forEach(([k, v]) => { if (k !== 'hillshade') toggleLayer(k, v); });
  setCrumbs([{t: 'Республика Саха (Якутия)'}]);
}

/* ---------- frame loop: rotation, flight, footer ---------- */
let lastT = performance.now(), lastUI = 0;
scene.preRender.addEventListener(() => {
  const now = performance.now(), dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  if (S.phase === 'intro' && now - S.userTouched > 5000) camera.rotate(C.Cartesian3.UNIT_Z, -dt * .06);
  flightTick(dt);
  if (aurora) aurora.material.uniforms.time = now / 1000;
  if (S.fx.clouds && now - (S.cloudT || 0) > 1000) { S.cloudT = now; updateClouds(); }
  if (!S.dayNight && scene.light instanceof C.DirectionalLight) C.Cartesian3.clone(camera.directionWC, scene.light.direction);
  if (now - lastUI > 200 && S.phase === 'map') {
    lastUI = now;
    const h = camera.positionCartographic.height;
    $('#camh').textContent = h > 10000 ? fmt(h / 1000) + ' км' : fmt(h) + ' м';
    $('#needle').setAttribute('transform', `rotate(${-C.Math.toDegrees(camera.heading)} 20 20)`);
    const cv = scene.canvas, cx = cv.clientWidth / 2, cy = cv.clientHeight / 2;
    const a = pickCarto(new C.Cartesian2(cx - 50, cy)), b = pickCarto(new C.Cartesian2(cx + 50, cy));
    $('#scale').textContent = a && b ? '100 px ≈ ' + (() => { const d = geoDist(a, b); return d > 2000 ? fmt(d / 1000, d > 20000 ? 0 : 1) + ' км' : fmt(d) + ' м'; })() : '—';
  }
});

/* ---------- input handlers ---------- */
const H = new C.ScreenSpaceEventHandler(scene.canvas);
let mmT = 0;
H.setInputAction(m => {
  const now = performance.now(); if (now - mmT < 70) return; mmT = now;
  const c = pickCarto(m.endPosition);
  if (c) {
    $('#cur').textContent = `${C.Math.toDegrees(c.latitude).toFixed(4)}°, ${C.Math.toDegrees(c.longitude).toFixed(4)}°`;
    updateGibsValue(c);
    $('#elev').textContent = S.terrain ? (globe.getHeight(c) != null ? fmt(globe.getHeight(c)) + ' м' : '—') : 'рельеф выключен';
  }
  if (S.phase !== 'map' || S.tool || F.active || S.quiz.on) { $('#tip').classList.add('hidden'); return; }   // в викторине подписи-подсказки скрыты
  setHover(pickSaha(m.endPosition), m.endPosition);
}, C.ScreenSpaceEventType.MOUSE_MOVE);
H.setInputAction(c => {
  if (S.phase !== 'map') return;
  if (S.tool) { toolClick(c.position); return; }
  const s = pickSaha(c.position); if (!s) return;
  if (S.quiz.on) { if (S.quiz.mode === 'centre' || !quizClick(s)) toast(S.quiz.mode === 'centre' ? 'Выберите ответ в панели слева' : 'Нажмите на нужный объект на карте'); return; }
  $('#tip').classList.add('hidden'); openObject(s);
}, C.ScreenSpaceEventType.LEFT_CLICK);
H.setInputAction(() => { if (S.tool) finishTool(); }, C.ScreenSpaceEventType.RIGHT_CLICK);
['pointerdown', 'wheel', 'touchstart'].forEach(ev => scene.canvas.addEventListener(ev, () => { S.userTouched = performance.now(); }, {passive: true}));

/* ---------- top bar / misc wiring ---------- */
$('#baseSel').innerHTML = Object.entries(BASES).map(([k, b]) => `<option value="${k}">${b.n}</option>`).join('');
$('#baseSel').onchange = e => setBase(e.target.value);
$('#langSel').onchange = e => { S.lang = e.target.value; LS.set('lang', S.lang); refreshLabels(); };
$('#dim').onclick = () => {
  if (scene.mode === C.SceneMode.SCENE3D) { scene.morphTo2D(1.2); $('#dim').textContent = '3D'; }
  else { scene.morphTo3D(1.2); $('#dim').textContent = '2D'; }
};
$('#logo').onclick = goHome; $('#back').onclick = goHome; $('#rx').onclick = () => { closePanel(); };
$('#lx').onclick = closeLeft;
document.querySelectorAll('.nb').forEach(b => b.onclick = () => b.classList.contains('on') ? closeLeft() : openLeft(b.dataset.p));
$('#compass').onclick = () => camera.flyTo({destination: camera.positionWC.clone(), orientation: {heading: 0, pitch: camera.pitch, roll: 0}, duration: .8});
$('#search').oninput = e => { sugg = doSearch(e.target.value); suggI = -1; renderSugg(); };
$('#search').onkeydown = e => {
  if (e.key === 'ArrowDown') { suggI = Math.min(sugg.length - 1, suggI + 1); renderSugg(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { suggI = Math.max(0, suggI - 1); renderSugg(); e.preventDefault(); }
  if (e.key === 'Enter') pickSugg(sugg[Math.max(0, suggI)]);
  if (e.key === 'Escape') $('#sugg').classList.add('hidden');
};
$('#search').onblur = () => setTimeout(() => $('#sugg').classList.add('hidden'), 150);
$('#fPlay').onclick = () => {
  if (F.mode === 'path' && F.s >= F.total) { F.s = 0; F.paused = false; } else F.paused = !F.paused;
  $('#fPlay').textContent = F.paused ? '▶ Продолжить' : '⏸ Пауза';
};
$('#fSpeed').oninput = e => { F.speed = +e.target.value; $('#fSpeedV').textContent = F.speed + '×'; };
$('#fAlt').oninput = e => { F.alt = +e.target.value; $('#fAltV').textContent = F.alt + ' м'; };
$('#fStop').onclick = () => stopFlight();
$('#fHome').onclick = () => { stopFlight(); goHome(); };
$('#settingsBtn').onclick = () => {
  const m = $('#modal');
  m.innerHTML = `<div class="glass">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Настройки</h3><button class="x" id="mx">×</button></div>
    <div class="sec">3D-рельеф</div>
    ${['free', 'ion', 'none'].map(k => `<div class="row"><input type="radio" name="tsrc" id="ts_${k}" value="${k}" ${S.terrainSrc === k ? 'checked' : ''}><label for="ts_${k}">${{free: '<b>Terrain Tiles</b> — открытые данные, без ключа <br><small class="muted">SRTM / GMTED2010 / ETOPO1 (Mapzen, AWS Open Data)</small>', ion: '<b>Cesium World Terrain</b> — точнее, нужен бесплатный токен', none: 'Без рельефа (быстрее на слабых компьютерах)'}[k]}</label></div>`).join('')}
    <div id="ionBox" style="${S.terrainSrc === 'ion' ? '' : 'display:none'}">
      <div class="txt" style="font-size:13px">Токен: зарегистрируйтесь на <a style="color:var(--ice)" href="https://ion.cesium.com/signup" target="_blank">ion.cesium.com</a> → Access Tokens → скопируйте Default token.</div>
      <div style="display:flex;gap:6px;margin-top:8px"><input id="ionTok" style="flex:1" placeholder="eyJhbGciOi…" value="${esc(LS.get('ion', ''))}"><button class="btn gold" id="ionApply">Подключить</button></div>
    </div>
    <div class="row"><label>Вертикальное преувеличение рельефа</label><input type="range" id="vex" min="1" max="5" step="0.5" value="${scene.verticalExaggeration || 1}"><span id="vexV">${scene.verticalExaggeration || 1}×</span></div>
    <div class="sec">День и ночь</div>
    <div class="row"><input type="checkbox" class="switch" id="dn" ${S.dayNight ? 'checked' : ''}><label for="dn">Освещение по реальному положению Солнца</label></div>
    <div class="row"><label>Дата и время (UTC)</label><input type="datetime-local" id="dnt" value="${C.JulianDate.toIso8601(viewer.clock.currentTime).slice(0, 16)}"></div>
    <div class="sec">Данные</div>
    <button class="btn" id="clr">Очистить кэш геоданных и перезагрузить</button>
    <div class="note">Геоданные: © участники OpenStreetMap (ODbL), Natural Earth (public domain), Wikidata (CC0), Википедия (CC BY-SA). Подложки: Esri, CARTO, OpenTopoMap, OSM.</div></div>`;
  m.classList.remove('hidden');
  $('#mx').onclick = () => m.classList.add('hidden');
  m.onclick = e => { if (e.target === m) m.classList.add('hidden'); };
  $('#ionApply').onclick = () => { const t = $('#ionTok').value.trim(); if (t) setTerrain('ion', t); };
  document.querySelectorAll('input[name=tsrc]').forEach(r => r.onchange = () => {
    $('#ionBox').style.display = r.value === 'ion' ? '' : 'none';
    if (r.value !== 'ion') setTerrain(r.value);
    else if (LS.get('ion', '')) setTerrain('ion', LS.get('ion', ''));
  });
  $('#vex').oninput = e => { scene.verticalExaggeration = +e.target.value; LS.set('vex', +e.target.value); $('#vexV').textContent = e.target.value + '×'; };
  $('#dn').onchange = e => { S.dayNight = e.target.checked; applyLighting(); };
  $('#dnt').onchange = e => { try { viewer.clock.currentTime = C.JulianDate.fromIso8601(e.target.value + ':00Z'); viewer.clock.shouldAnimate = false; } catch (x) {} };
  $('#clr').onclick = () => { try { indexedDB.deleteDatabase('saha3d'); } catch (x) {} try { Object.keys(localStorage).filter(k => /^saha3d:(main|nas)_/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (x) {} location.reload(); };
};
$('#start').onclick = () => journey();
$('#skip').onclick = async () => { S.skip = true; camera.cancelFlight(); camera.setView(HOME); await dataReady; dsRep.show = S.layers.republic; enterMap(); };
window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.tool) setTool(null); else if (F.active) stopFlight(); } });

/* ---------- boot ---------- */
S.lang = LS.get('lang', 'ru'); $('#langSel').value = S.lang;
setBase(S.base); renderMarks();
for (const k of ['aurora', 'clouds', 'snow']) if (S.fx[k]) setFx(k, true);
S.terrainSrc = 'none';
scene.verticalExaggeration = LS.get('vex', 1.5);
{ const src = LS.get('terrainSrc', 'free');                          // по умолчанию — открытый рельеф без ключа
  if (src === 'ion' && LS.get('ion', '')) setTerrain('ion', LS.get('ion', ''), true);
  else if (src === 'free') setTerrain('free', null, true); }
function boot() {
  const st = $('#introStatus');
  dataReady = loadMain(m => { st.textContent = m; })
    .then(data => { build(data); st.innerHTML = `✓ ${S.districts.length} районов и округов · ${fmt(S.places.length)} населённых пунктов · OpenStreetMap`; })
    .catch(e => {
      console.error(e);
      if (/Failed to fetch|NetworkError|Load failed/i.test(e.message) && (IN_FRAME || location.protocol === 'blob:')) envBlocked('сетевые запросы заблокированы окружением (' + e.message + ')');
      st.innerHTML = '<span style="color:var(--err)">Не удалось загрузить границы: ' + esc(e.message) + '</span>';
      toast('Геоданные не загрузились: ' + esc(e.message), 'err', {label: 'Повторить', fn: boot});
    });
  return dataReady;
}
boot();
window.SAHA = {viewer, S};
/* Сборка снимка геоданных — запускается вручную на локальном сервере (start-saha3d.bat):
   SAHA.exportSnapshot() — сохраняет все данные в папку data/ рядом с index.html */
SAHA.exportSnapshot = async (log = console.log) => {
  const save = async (path, obj) => { const r = await fetch('/__save/data/' + path, {method: 'POST', body: JSON.stringify(obj)}); if (!r.ok) throw new Error(path + ': HTTP ' + r.status); log('✓ data/' + path); };
  const main = LS.get('main_v1') || await loadMain(() => {});
  await save('main.json', main);
  for (const d of S.districts) {
    let tries = 0;
    while (true) { try { await loadNaslegs(d); break; } catch (e) { if (++tries > 3) { log('✗ наслеги ' + d.tags.name + ': ' + e.message); break; } await sleep(5000); } }
    const n = LS.get('nas_v1_' + d.id); if (n) await save('naslegs/' + d.id + '.json', n);
  }
  for (const k of Object.keys(THEMES)) {
    try { await loadTheme(k); const c = await IDB.get('th_v1_' + k); if (c) await save('themes/' + k + '.json', {...c, snap: true}); }
    catch (e) { log('✗ слой ' + k + ': ' + e.message); }
  }
  await loadRivers(); await save('rivers.json', {src: S.riversSrc, rivers: S.rivers.map(({ents, ...r}) => r)});
  await loadLakes(); await save('lakes.json', {src: S.lakesSrc, lakes: S.lakes.map(({f, ...l}) => l)});
  log('Готово'); return true;
};   // для отладки из консоли
</script>
</body>
